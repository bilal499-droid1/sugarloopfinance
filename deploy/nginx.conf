# Sugarloop: Nginx serves the built React app and forwards the API to Node (PM2, port 5000).
server {
    listen 80 default_server;
    server_name _;

    root /var/www/sugarloop;
    index index.html;
    client_max_body_size 15m; # receipt image uploads

    # Live change feed (Server-Sent Events): no buffering, long-lived.
    location = /api/live {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
    }

    # Hashed build assets can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router: unknown paths load the app.
    location / {
        try_files $uri /index.html;
    }
}
